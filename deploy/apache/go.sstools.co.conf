<VirtualHost *:443>
    ServerName go.sstools.co

    ProxyPreserveHost On

    # SSE requires response buffering disabled so events flush immediately
    ProxyPass /api/events http://127.0.0.1:8080/api/events flushpackets=on
    ProxyPassReverse /api/events http://127.0.0.1:8080/api/events

    # MCP endpoint for AI agents (#0151). The catch-all below would already
    # proxy it (Authorization, Origin and the POST body all pass through), so
    # this block only adds what a streamed response needs if /mcp ever answers
    # with SSE: flush each chunk, never gzip it, and allow a longer idle time
    # than the 60s default. Today the server is stateless and returns plain JSON.
    # It must appear before the wildcard ProxyPass, like /api/events.
    ProxyPass /mcp http://127.0.0.1:8080/mcp flushpackets=on timeout=120
    ProxyPassReverse /mcp http://127.0.0.1:8080/mcp
    <Location "/mcp">
        SetEnv no-gzip 1
    </Location>

    ProxyPass / http://127.0.0.1:8080/
    ProxyPassReverse / http://127.0.0.1:8080/

    SSLEngine on
    SSLCertificateFile    /etc/letsencrypt/live/go.sstools.co/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/go.sstools.co/privkey.pem
</VirtualHost>
